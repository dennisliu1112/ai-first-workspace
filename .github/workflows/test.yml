name: Unit Tests & Repo Purity Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js (for HTML/JS simulator runtime tests)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Anti-Dump Repo Purity Check
        run: python -B scripts/audit-workspace.py --check-repo . --lang en

      - name: Run Full Unit Test Suite
        run: python -B -m unittest discover -s tests -v
